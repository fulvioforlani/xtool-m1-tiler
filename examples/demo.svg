  <polygon points="98,14 112,40 84,40" fill="#000000"/>
  <rect x="48" y="62" width="30" height="14" rx="3" fill="#000000"/>
  <path d="M 14 70 C 14 60 30 60 30 70 C 30 80 14 80 14 70 Z M 19 70 C 19 66 25 66 25 70 C 25 74 19 74 19 70 Z" fill="#000000" fill-rule="evenodd"/>
  <!-- TAGLIO: tratto rosso, senza riempimento -->
  <rect x="2" y="2" width="116" height="86" rx="8" fill="none" stroke="#ff0000" stroke-width="0.1"/>
  <circle cx="60" cy="10" r="2" fill="none" stroke="#ff0000" stroke-width="0.1"/>
